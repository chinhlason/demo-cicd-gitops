apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-cicd-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chinhlason/demo-cicd-gitops.git
    targetRevision: main
    path: charts/demo-cicd-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: democicd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
