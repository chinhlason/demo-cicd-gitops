replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:1fc7e54d2b77ca61a90579ba7100e9e592c85a0283234d5bba4a41b72066bc19
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-message: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-message: |
    {{- with secret "app-secrets/data/democicd" -}}
    {{ .Data.data.message }}
    {{- end }}
