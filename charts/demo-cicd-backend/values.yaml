replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:b8a0198162b2b78959abb15d7fa5202e178cb5db14f54f8c95227db4cb3f5a53
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-message: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-message: |
    {{- with secret "app-secrets/data/democicd" -}}
    {{ .Data.data.message }}
    {{- end }}
