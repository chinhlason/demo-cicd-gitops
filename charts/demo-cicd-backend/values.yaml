replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:364806df2223e859a5ed4df8ee2553b3bbe2a898c04a8d0528addc8f4e36261a
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-message: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-message: |
    {{- with secret "app-secrets/data/democicd" -}}
    {{ .Data.data.message }}
    {{- end }}
