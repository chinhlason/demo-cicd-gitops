replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:ccce0717007162f528d412b6c3ca41b8493fb9946be9169b25d29fbc86324669
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-application-secrets.yml: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-application-secrets.yml: |
    {{ with secret "app-secrets/data/democicd" }}
    app:
      secrets: {{ .Data.data | toJSON }}
    {{ end }}
