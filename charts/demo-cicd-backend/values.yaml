replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:9b748bb2398e966e154be0b55bf4000a85c3c047793cc9477b1cd74d10c9f090
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  path: /

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-application-secrets.yml: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-application-secrets.yml: |
    {{ with secret "app-secrets/data/democicd" }}
    app:
      secrets: {{ .Data.data | toJSON }}
    {{ end }}
