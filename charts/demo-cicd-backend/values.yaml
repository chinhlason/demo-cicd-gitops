replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:5b7dcdf39f58d2207b6b6e6ba164db383d1dd2105db0703e8678279e235891f3
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-message: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-message: |
    {{- with secret "app-secrets/data/democicd" -}}
    {{ .Data.data.message }}
    {{- end }}
