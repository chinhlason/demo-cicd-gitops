replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:49a303c6089166996d05d9d73758b16ae1fd62f18197b349d90edc05fdcb2f1c
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  path: /

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-application-secrets.yml: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-application-secrets.yml: |
    {{ with secret "app-secrets/data/democicd" }}
    app:
      secrets: {{ .Data.data | toJSON }}
    {{ end }}
