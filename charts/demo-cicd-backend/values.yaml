replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:f0aeca3c09c9e495ad7365e00bf8101aefd3cb1ea9fdf7c7ce7b67a047239d36
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  path: /

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-application-secrets.yml: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-application-secrets.yml: |
    {{ with secret "app-secrets/data/democicd" }}
    app:
      secrets: {{ .Data.data | toJSON }}
    {{ end }}
