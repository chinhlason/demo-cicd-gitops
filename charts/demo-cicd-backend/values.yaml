replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:d1b61199cab1cd043ab8ab39e6dd24f7ba9eb94fee6933649f00a33195f30dbe
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-application-secrets.yml: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-application-secrets.yml: |
    {{- with secret "app-secrets/data/democicd" -}}
    app:
      secrets:
        message: {{ .Data.data.message | quote }}
    {{- end }}
