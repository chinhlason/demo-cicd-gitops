replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:3cfeea6b5df833c9ce2e8dd432a925bc2ae9d79830834b5ab676f2475acbf259
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-message: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-message: |
    {{- with secret "app-secrets/data/democicd" -}}
    {{ .Data.data.message }}
    {{- end }}
