replicaCount: 1

image:
  repository: sonnvt/demo-cicd-backend-app
  tag: latest
  digest: sha256:9dcd65ae59112dbae73dda58e9135cfb8c4f2ce19f6e5d6fd1175a4d28b54a44
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-pull

serviceAccount:
  create: true
  name: democicd-app

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: democicd-app
  vault.hashicorp.com/agent-inject-secret-application-secrets.yml: app-secrets/data/democicd
  vault.hashicorp.com/agent-inject-template-application-secrets.yml: |
    {{ with secret "app-secrets/data/democicd" }}
    app:
      secrets:
    {{ range $key, $value := .Data.data }}
        {{ $key | quote }}: {{ $value | toJson }}
    {{ end }}
    {{ end }}
